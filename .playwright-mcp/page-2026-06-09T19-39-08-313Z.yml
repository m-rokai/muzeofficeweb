    - generic [ref=e265]:
      - generic [ref=e266]:
        - heading "Why the Day Pass at Muze Office Las Vegas" [level=2] [ref=e267]
        - paragraph [ref=e268]: "Most people who need a real workspace for a single day in Las Vegas end up at the wrong place for the wrong reason. Coffee shops on Paradise Rd and the Strip fill up by 10am and the WiFi collapses the moment you try to screen-share. Hotel lobbies are crowded, noisy, and mostly out of seats with outlets. Airport lounges at LAS charge $50-65 for a crowded counter that isn't a desk. Hotel business centers run $15-30 for a windowless room with a decade-old desktop. The $25 Day Pass at Muze Office replaces all of those with a single clean option: a real desk, a real chair, fast WiFi built for video calls, unlimited coffee, free parking, and phone booths when you need a private call."
        - paragraph [ref=e269]: The Day Pass is a walk-in product. Show up Monday through Friday between 10am and 7pm, drop your ID at the front desk, and you're at a working desk within five minutes. You can book online if you want to lock in a spot during a busy convention week or Strip event, but most days walk-in availability is not a problem. Day pass holders get the same WiFi, the same coffee, the same phone booths, and the same cafe access as monthly members — the only thing they don't get is 24/7 access and meeting-room credits (meeting rooms are bookable by the hour separately).
        - paragraph [ref=e270]: The location is the part that makes the Day Pass practical for out-of-town visitors. 6860 Bermuda Rd, Suite 200 sits in the 89119 business corridor off I-215, 10 minutes from Harry Reid International Airport and well away from Strip tourist traffic. That means you can fly into LAS in the morning, rent a car, spend the middle of the day working, make a client meeting, and be back at the terminal before your return flight — all with free parking, no Strip traffic, and a clean place to take the calls that matter.
      - generic [ref=e271]:
        - heading "Day Pass vs. a monthly Hot Desk or Dedicated Desk" [level=2] [ref=e272]
        - paragraph [ref=e273]: If you're in town for a single day or a small handful of days a month, the Day Pass at $25/day is the right product. It's walk-in, it's low-commitment, and it covers every core amenity you'd use on a short visit. A single Day Pass costs roughly the same as a day of cafe-hopping ($15-25 in drinks) but replaces the noise, the unreliable WiFi, and the implied buy-another-drink pressure with a real workspace.
        - paragraph [ref=e274]: If you end up needing the space more than about a week per month, the Hot Desk at $350/month is the natural upgrade. Hot Desk members get any-desk 24/7 biometric access, monthly meeting room credits, mail handling, and full access to community events — the math flips in Hot Desk's favor somewhere around the 14th or 15th day in the space, and you also pick up late-night and weekend access the Day Pass doesn't include. For your own reserved desk you can leave a monitor on, personal storage, meeting room credits, and a business address with mail, Dedicated Desk at $399/month is the next step. If you're using the space daily, Dedicated Desk is the shape that fits.
        - paragraph [ref=e275]: The three products are genuinely differentiated, not marketing rebrandings of the same thing. Pick the one whose commitment level matches how you actually plan to use the space. Start with a Day Pass if you're not sure — we'd rather you try us for a day and upgrade on your own timeline than sign up for something you don't end up using.
      - generic [ref=e276]:
        - heading "How to use a Day Pass at Muze Office Las Vegas" [level=2] [ref=e277]
        - paragraph [ref=e278]: Walk in Monday through Friday between 10am and 7pm at 6860 Bermuda Rd, Suite 200. Show your ID at the front desk, pay for the Day Pass ($25), and we'll point you to an open desk. The whole process takes about five minutes. If you're arriving during a major convention week (CES, SEMA, NAB, MAGIC, etc.) it's worth booking online the day before so your spot is reserved — but most days, walk-in is fine.
        - paragraph [ref=e279]: The Day Pass covers desk access, WiFi, unlimited coffee and water, free parking, phone-booth access for private calls, printing, and the on-site Muze Cafe. Meeting rooms are a separate booking at $25-$75/hour and can be reserved by the hour online. If you need to take a client call during your day, a Huddle Room ($25/hr) is usually the right call.
        - paragraph [ref=e280]: If you come back more than one week a month, move to a Hot Desk or Dedicated Desk. See /las-vegas-hot-desk for any-desk 24/7 biometric access, or /las-vegas-dedicated-desk to add a reserved desk and a business address with mail.
